name: Tests and SonarQube Cloud

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test-and-analyze:
    name: Tests, coverage, and SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: >-
          python -m pip install --only-binary=:all:
          -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}/capture" python -m coverage run -m unittest discover -s capture/tests -v
          PYTHONPATH="${GITHUB_WORKSPACE}/ai/vision:${GITHUB_WORKSPACE}/capture:${GITHUB_WORKSPACE}/ai/temporal" python -m coverage run --append -m unittest discover -s ai/vision/tests -v
          PYTHONPATH="${GITHUB_WORKSPACE}/ai/temporal" python -m coverage run --append -m unittest discover -s ai/temporal/tests -v
          PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/capture" python -m coverage run --append -m unittest discover -s streaming/tests -v
          python -m coverage xml
          python -m coverage report

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
