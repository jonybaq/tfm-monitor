name: Snyk Code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
      - name: Analyze source code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          : "${SNYK_TOKEN:?Configure the SNYK_TOKEN repository secret}"
          status=0
          snyk code test >"$RUNNER_TEMP/snyk-code.log" 2>&1 || status=$?
          case "$status" in
            0) echo 'Snyk Code completed with no findings.' ;;
            1) echo 'Snyk Code completed with findings.' ;;
            *)
              grep -oE 'SNYK-[A-Z]+-[0-9]{4,}' "$RUNNER_TEMP/snyk-code.log" | sort -u || true
              echo "::error::Snyk Code did not complete (exit $status)."
              exit "$status"
              ;;
          esac
